<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animated Login</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    }

    /* Animated background */
    .background span {
      position: absolute;
      display: block;
      width: 50px;
      height: 50px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 50%;
      animation: float 15s linear infinite;
      bottom: -100px;
    }

    .background span:nth-child(1) {
      left: 10%;
      width: 80px;
      height: 80px;
      animation-duration: 12s;
    }

    .background span:nth-child(2) {
      left: 25%;
      width: 30px;
      height: 30px;
      animation-duration: 8s;
      animation-delay: 2s;
    }

    .background span:nth-child(3) {
      left: 50%;
      width: 100px;
      height: 100px;
      animation-duration: 18s;
    }

    .background span:nth-child(4) {
      left: 70%;
      width: 40px;
      height: 40px;
      animation-duration: 10s;
      animation-delay: 3s;
    }

    .background span:nth-child(5) {
      left: 85%;
      width: 70px;
      height: 70px;
      animation-duration: 14s;
    }

    @keyframes float {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 0;
      }

      20% {
        opacity: 1;
      }

      100% {
        transform: translateY(-110vh) rotate(360deg);
        opacity: 0;
      }
    }

    /* Login card */
    .login-box {
      position: relative;
      width: 380px;
      padding: 45px 35px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      backdrop-filter: blur(15px);
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4);

      animation: appear 1s ease forwards;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(50px) scale(0.9);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    h2 {
      text-align: center;
      color: white;
      font-size: 32px;
      margin-bottom: 30px;
    }

    .input-box {
      position: relative;
      margin: 25px 0;
    }

    .input-box input {
      width: 100%;
      padding: 14px 5px;
      background: transparent;
      border: none;
      border-bottom: 2px solid rgba(255, 255, 255, 0.5);
      outline: none;
      color: white;
      font-size: 16px;
      transition: 0.3s;
    }

    .input-box label {
      position: absolute;
      left: 5px;
      top: 14px;
      color: rgba(255, 255, 255, 0.7);
      pointer-events: none;
      transition: 0.3s;
    }

    .input-box input:focus,
    .input-box input:valid {
      border-bottom-color: #00eaff;
    }

    .input-box input:focus ~ label,
    .input-box input:valid ~ label {
      top: -12px;
      font-size: 12px;
      color: #00eaff;
    }

    .options {
      display: flex;
      justify-content: space-between;
      color: white;
      font-size: 13px;
      margin: 15px 0 25px;
    }

    .options a {
      color: #00eaff;
      text-decoration: none;
    }

    /* Button */
    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 30px;
      background: linear-gradient(90deg, #00eaff, #7b2cff);
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
      box-shadow: 0 0 15px rgba(0, 234, 255, 0.4);
    }

    button:hover {
      transform: translateY(-3px);
      box-shadow: 0 0 30px rgba(0, 234, 255, 0.8);
    }

    .register {
      text-align: center;
      color: white;
      margin-top: 25px;
      font-size: 14px;
    }

    .register a {
      color: #00eaff;
      text-decoration: none;
      font-weight: bold;
    }

    /* Responsive */
    @media (max-width: 450px) {
      .login-box {
        width: 90%;
        padding: 35px 25px;
      }
    }
  </style>
</head>

<body>

  <!-- Animated background -->
  <div class="background">
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
  </div>

  <!-- Login Form -->
  <div class="login-box">

    <h2>Welcome Back</h2>

    <form id="loginForm">

      <div class="input-box">
        <input type="email" required>
        <label>Email</label>
      </div>

      <div class="input-box">
        <input type="password" required>
        <label>Password</label>
      </div>

      <div class="options">
        <label>
          <input type="checkbox">
          Remember me
        </label>

        <a href="#">Forgot Password?</a>
      </div>

      <button type="submit">Login</button>

      <div class="register">
        Don't have an account?
        <a href="#">Register</a>
      </div>

    </form>
  </div>

  <script>
    document.getElementById("loginForm").addEventListener("submit", function(event) {
      event.preventDefault();

      const button = document.querySelector("button");

      button.innerText = "Logging in...";
      button.style.opacity = "0.7";

      setTimeout(() => {
        button.innerText = "Login Successful ✓";
        button.style.background = "linear-gradient(90deg, #00c853, #00e676)";
        button.style.opacity = "1";
      }, 1200);
    });
  </script>

</body>
</html>
